# Verifier, puis publier — dans cet ordre, et jamais l'un sans l'autre.
#
# Avant ce workflow, GitHub Pages publiait directement la branche : n'importe
# quel push partait en ligne sans qu'un seul test ne tourne. C'est ce qui a
# laisse passer en production un index.html dont trois onglets sur quatre
# etaient invisibles. Le deploiement depend donc maintenant du job de tests.
#
# Pour que ce workflow soit reellement la source du site, le depot doit etre
# regle sur Settings -> Pages -> Source : GitHub Actions. Laisse sur
# « Deploy from a branch », GitHub continuerait de publier la branche en
# parallele et ce garde-fou ne servirait a rien.
name: Vérification et publication

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Lecture seule pour les tests. Les droits d'ecriture sur Pages sont demandes
# par le job de publication seulement, plus bas.
permissions:
  contents: read

# Un push qui en suit un autre de pres rend le premier sans objet. On annule
# l'execution en cours plutot que de publier deux fois de suite.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # Le test navigateur a besoin de Chromium. --with-deps installe aussi
      # les bibliotheques systeme que le runner n'a pas par defaut, sans quoi
      # le navigateur se lance puis meurt sans message exploitable.
      - name: Installer Playwright et Chromium
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      # Suites rapides d'abord : elles echouent en quelques secondes et
      # evitent d'attendre le navigateur pour une erreur de donnees.
      - name: Profil d'exemple — synchronisation et cohérence
        run: node tests/test-profil-sync.js

      - name: Checklist — DOM simulé
        run: node tests/test-checklist.js

      - name: Formats winget
        run: node tests/test-winget.js

      - name: Inventaire étendu (tailles, variables)
        run: node tests/test-inventaire-etendu.js

      - name: Dépendances entre éléments
        run: node tests/test-dependances.js

      - name: Réconciliation source → cible
        run: node tests/test-reconciliation.js

      # pwsh est preinstalle sur les runners ubuntu-latest.
      - name: Scanner — classement, fusion, parsing
        run: pwsh -File tests/test-scan.ps1

      - name: Vérification du PC — rapprochement
        run: pwsh -File tests/test-verification.ps1

      # Le seul script PowerShell du projet qui tourne vraiment hors Windows :
      # il ne lit que des fichiers. Le test l'execute sur une arborescence
      # construite pour l'occasion, au lieu de simuler ses resultats.
      - name: Vérification des sauvegardes — exécution réelle
        run: pwsh -File tests/test-sauvegardes.ps1

      - name: Lanceur — actions et fichiers
        run: pwsh -File tests/test-lanceur.ps1

      - name: Configurations — aller-retour réel
        run: pwsh -File tests/test-configs-aller-retour.ps1

      - name: Compatibilité Windows PowerShell 5.1
        run: pwsh -File tests/test-powershell-compatibility.ps1

      - name: Checklist — rendu navigateur
        run: node tests/test-navigateur.js

      - name: Import d'une vérification de PC
        run: node tests/test-verification-pc.js

      - name: Installabilité et fonctionnement hors ligne
        run: node tests/test-pwa.js

      # STRICT fait echouer sur le moindre ecart : le projet part de zero
      # defaut, une regression doit bloquer plutot que d'etre signalee.
      - name: Ergonomie tactile
        run: STRICT=1 node tests/test-mobile.js

      - name: Accessibilité et réversibilité
        run: node tests/test-accessibilite.js

      - name: Mode guidé
        run: node tests/test-guide.js

      - name: Onglet « Avant de quitter »
        run: node tests/test-quitter.js

      - name: Migration ou réinstallation
        run: node tests/test-scenarios.js

      - name: Remises à zéro
        run: node tests/test-reinit.js

      - name: Menu de la barre du haut
        run: node tests/test-menu.js

      - name: Profil hostile — aucune injection
        run: node tests/test-profil-hostile.js

      - name: Sauvegarde — aucun échec silencieux
        run: node tests/test-sauvegarde.js

      - name: Deux questions et second PC
        run: node tests/test-debut.js

      - name: Configuration et affichage
        run: node tests/test-config.js

      - name: Scripts et chargement automatique
        run: node tests/test-outils.js

  # Tout le job ci-dessus tourne sur Linux, contre des donnees fabriquees a la
  # main : cela verifie le raisonnement, jamais Windows. Le registre,
  # Get-AppxPackage, WMI et l'encodage d'une console reelle n'y sont jamais
  # exerces — et c'est pourtant la que ces scripts vont tourner.
  #
  # Les suites restent sur Linux : elles repondent en quelques secondes et
  # attrapent les regressions de logique. Celui-ci ajoute la realite.
  #
  # Il a tourne en `continue-on-error` le temps de se stabiliser, puis il est
  # devenu bloquant : un garde-fou qui laisse passer ce qu'il refuse ne sert
  # qu'a decorer. Il a trouve son premier vrai defaut au premier passage utile
  # — un -Include ignore par Windows PowerShell 5.1, qui faisait rapporter le
  # disque entier a la recherche de cles — invisible partout ailleurs.
  verifier-windows:
    name: Tests sur Windows
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # PowerShell 7, la meme version que sur le runner Linux : ce qui change
      # ici, c'est le systeme dessous, pas l'interpreteur.
      - name: Scanner — PowerShell 7
        shell: pwsh
        run: pwsh -File tests/test-scan.ps1

      - name: Vérification du PC — PowerShell 7
        shell: pwsh
        run: pwsh -File tests/test-verification.ps1

      - name: Vérification des sauvegardes — PowerShell 7
        shell: pwsh
        run: pwsh -File tests/test-sauvegardes.ps1

      - name: Lanceur — PowerShell 7
        shell: pwsh
        run: pwsh -File tests/test-lanceur.ps1

      - name: Configurations — PowerShell 7
        shell: pwsh
        run: pwsh -File tests/test-configs-aller-retour.ps1

      - name: Marqueurs d'encodage — PowerShell 7
        shell: pwsh
        run: pwsh -File tests/test-powershell-compatibility.ps1

      # Windows PowerShell 5.1 : celui qui est livre avec Windows, et celui
      # qu'on obtient en double-cliquant sur un .bat. C'est la version que les
      # gens executent vraiment, et elle n'avait jamais rien execute.
      - name: Scanner — Windows PowerShell 5.1
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/test-scan.ps1

      - name: Vérification du PC — Windows PowerShell 5.1
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/test-verification.ps1

      - name: Vérification des sauvegardes — Windows PowerShell 5.1
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/test-sauvegardes.ps1

      - name: Lanceur — Windows PowerShell 5.1
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/test-lanceur.ps1

      - name: Configurations — Windows PowerShell 5.1
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/test-configs-aller-retour.ps1

      # Le vrai scan de la vraie machine : registre, paquets APPX, WMI. C'est
      # la seule etape du projet qui exerce la detection Windows telle qu'elle
      # tournera chez quelqu'un.
      - name: Le scan sur la vraie machine — PowerShell 7
        shell: pwsh
        run: pwsh -File tests/test-windows-reel.ps1

      - name: Le scan sur la vraie machine — Windows PowerShell 5.1
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/test-windows-reel.ps1

      # Un scan laisse resultat-scan.js a cote de la page. Le test le retire,
      # mais si une etape a echoue avant son nettoyage, on veut le savoir ici
      # plutot que de le decouvrir dans un artefact publie.
      - name: Rien ne traine apres le passage
        if: always()
        shell: pwsh
        run: |
          if (Test-Path resultat-scan.js) {
            Write-Host "resultat-scan.js est reste dans le depot" -ForegroundColor Red
            exit 1
          }
          $sale = git status --porcelain
          if ($sale) { Write-Host "le depot a ete modifie :`n$sale" -ForegroundColor Red; exit 1 }
          Write-Host "depot propre"

  publier:
    name: Publier sur Pages
    # Les deux, et dans les deux versions de PowerShell : ce qui part en ligne
    # a ete verifie sur le systeme ou il va tourner, pas seulement sur Linux.
    needs: [verifier, verifier-windows]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      # Le site est le depot lui-meme : pas d'etape de construction, le
      # fichier publie est exactement celui qui vient d'etre teste.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploiement
        uses: actions/deploy-pages@v4
